name: Update YouTube RSS feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - 'config.js'
      - 'scripts_update_feed.py'
      - '.github/workflows/youtube-rss.yml'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update feed
        run: python3 scripts_update_feed.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/videos.json
          git diff --cached --quiet || git commit -m 'Update YouTube feed'
          git push
